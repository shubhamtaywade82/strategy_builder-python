[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strategy-builder"
version = "0.1.0"
description = "A strategy builder ported from Ruby"
requires-python = ">=3.8"
dependencies = [
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pytest>=7.4.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/strategy_builder"]

[project.scripts]
strategy-builder = "strategy_builder.cli:main"
