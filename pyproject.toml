[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strategy-builder"
version = "0.2.0"
description = "AI-powered Binance strategy builder with XGBoost research pipeline and React UI"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pytest>=7.4.0",
    "python-dotenv>=1.0.0",
    "websockets>=12.0",
    # strategy_research pipeline
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "shap>=0.42.0",
    "joblib>=1.3.0",
    "tqdm>=4.66.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/strategy_builder", "src/strategy_research"]

[project.scripts]
strategy-builder = "strategy_builder.cli:main"
strategy-research = "strategy_research.orchestrator:main"
